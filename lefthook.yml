pre-push:
  jobs:
    - name: packages audit
      tags:
        - frontend
        - security
      run: npm audit

    - name: eslint check
      tags:
        - frontend
        - lint
      run: npm run lint:check

    - name: prettier check
      tags:
        - frontend
        - format
      run: npx run prettier:check

    - name: typecheck
      tags:
        - frontend
        - typecheck
      run: npm run typecheck
#
pre-commit:
  parallel: true
  jobs:
    - name: eslint
      tags:
        - frontend
        - lint
      run: npm run lint 

    - name: prettier
      tags:
        - frontend
        - format
      run: npx run prettier
    
    - name: packages audit fix
      tags:
        - frontend
        - security
      run: npm audit fix

    - name: typecheck
      tags:
        - frontend
        - typecheck
      run: npm run typecheck

